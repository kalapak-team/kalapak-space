name: Database Backup (GitHub & Telegram)

on:
  schedule:
    - cron: "10 1 * * *" # Runs every 8:10 AM Cambodia time (UTC+7)
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Create Database Backup
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          filename="backup-$(TZ=Asia/Phnom_Penh date +'%Y-%m-%d-%H%M').sql"
          # Neon is PostgreSQL 18 — use matching client via official Docker image.
          docker run --rm \
            -e PGSSLMODE=require \
            postgres:18 \
            pg_dump "$DB_URL" \
              --schema=public \
              --no-owner \
              --no-acl \
            > "$filename"
          echo "BACKUP_FILE=$filename" >> $GITHUB_ENV

      - name: Push to Backup Repository
        run: |
          git config --global user.name "Kalapak Team"
          git config --global user.email "teamvcnh@gmail.com"
          git clone https://x-access-token:${{ secrets.BACKUP_REPO_TOKEN }}@github.com/kalapak-team/kalapak-db-backups.git backup_repo
          cp ${{ env.BACKUP_FILE }} backup_repo/
          cd backup_repo
          git add .
          git commit -m "📦 Automated Backup: ${{ env.BACKUP_FILE }}"
          git push

      - name: Send Report and File to Telegram
        run: |
          RESPONSE=$(curl -s \
               -F document=@"${{ env.BACKUP_FILE }}" \
               -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
               -F caption="✅ Kalapak DB Backup Success! Date: $(TZ=Asia/Phnom_Penh date +'%Y-%m-%d %H:%M') (ICT) | File: ${{ env.BACKUP_FILE }}" \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument")
          echo "Telegram response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true' || (echo "Telegram API error!" && exit 1)
