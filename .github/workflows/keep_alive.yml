name: Website Keep Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping_server:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Kalapak Team Website
        run: |
          echo "==> Pinging frontend..."
          curl -sS -o /dev/null -w "Frontend:        HTTP %{http_code} (%{time_total}s)\n" https://kalapak-team.space || true

          echo "==> Pinging backend (custom domain)..."
          curl -sS -o /dev/null -w "Backend custom:  HTTP %{http_code} (%{time_total}s)\n" https://api.kalapak-team.space/ping.php || true

          echo "==> Pinging backend (Render domain)..."
          curl -sS -o /dev/null -w "Backend render:  HTTP %{http_code} (%{time_total}s)\n" https://kalapakspace-backends.onrender.com/ping.php || true
