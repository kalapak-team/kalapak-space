services:
  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: kalapak_postgres
    environment:
      POSTGRES_DB: kalapak_db
      POSTGRES_USER: kalapak_user
      POSTGRES_PASSWORD: kalapak123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - kalapak_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalapak_user -d kalapak_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin ──
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kalapak_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kalapak.dev
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kalapak_network
    restart: unless-stopped

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: kalapak_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kalapak_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Laravel Backend ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: kalapak_backend
    environment:
      PORT: "8000"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "base64:Xq2ORYZKct/EDW69vLh7za498cRGbfqthRp7wqqkuAY="
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: kalapak_db
      DB_USERNAME: kalapak_user
      DB_PASSWORD: kalapak123
      DB_SSLMODE: prefer
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: file
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      SANCTUM_STATEFUL_DOMAINS: "localhost:3000"
      RUN_MIGRATIONS: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/var/www/html/app
      - ./backend/routes:/var/www/html/routes
      - ./backend/config:/var/www/html/config
      - ./backend/database:/var/www/html/database
      - ./backend/resources:/var/www/html/resources
      - ./backend/storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kalapak_network
    restart: unless-stopped

  # ── Nuxt Frontend ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: kalapak_frontend
    environment:
      NUXT_DEV_API_PROXY: http://backend:8000
      VITE_API_URL: http://localhost:8000/api
      NUXT_PUBLIC_API_URL: http://localhost:8000/api
      NUXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 3000"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - kalapak_network
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  frontend_node_modules:

networks:
  kalapak_network:
    driver: bridge
