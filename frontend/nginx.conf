worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # --- DDoS Protection ---
    # Rate limit zone: 10 requests/second per IP, burst up to 20
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    # Stricter zone for API: 5 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=5r/s;
    # Connection limit: max 20 simultaneous connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    # Return 429 instead of 503 when rate limited
    limit_req_status 429;
    limit_conn_status 429;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Allow large request bodies (blog posts with images, file uploads)
    client_max_body_size 20m;

    # Detect social media crawlers for dynamic OG meta tags
    map $http_user_agent $is_social_bot {
        default                     0;
        ~*facebookexternalhit       1;
        ~*Facebot                   1;
        ~*Twitterbot                1;
        ~*TelegramBot               1;
        ~*LinkedInBot               1;
        ~*WhatsApp                  1;
        ~*Slackbot                  1;
        ~*Discordbot                1;
        ~*Pinterest                 1;
        ~*Viber                     1;
        ~*Embedly                   1;
        ~*vkShare                   1;
        ~*Applebot                  1;
        ~*Line                      1;
        ~*ZaloBot                   1;
        ~*SkypeUriPreview           1;
        ~*Iframely                  1;
        ~*Googlebot                 1;
        ~*bingbot                   1;
    }

    server {
        listen PORT_PLACEHOLDER;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # DNS resolver for runtime upstream resolution (Google DNS + Cloudflare)
        resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
        resolver_timeout 10s;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://api.kalapak-team.space https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com;" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Global connection limit
        limit_conn conn_limit 20;

        # SPA fallback — serve index.html for all non-file routes
        location / {
            limit_req zone=general burst=20 nodelay;
            try_files $uri $uri/ /index.html;
        }

        # OG Meta: Rewrite social media crawler requests to the API OG endpoint
        # Bots → rewrite to /api/og/blog/{slug} (handled by existing /api/ proxy)
        # Non-bots → serve SPA (index.html)
        location ~ ^/blog/(.+)$ {
            if ($is_social_bot) {
                rewrite ^/blog/(.+)$ /api/og/blog/$1 last;
            }
            try_files $uri /index.html;
        }

        # SEO: Proxy sitemap.xml and robots.txt to backend
        location = /sitemap.xml {
            set $backend BACKEND_URL_PLACEHOLDER;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
        }

        location = /robots.txt {
            set $backend BACKEND_URL_PLACEHOLDER;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
        }

        # Proxy API requests to backend (stricter rate limit)
        location /api/ {
            limit_req zone=api_zone burst=10 nodelay;

            set $backend BACKEND_URL_PLACEHOLDER;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_ssl_server_name on;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Proxy storage/media requests to backend
        location /storage/ {
            set $backend BACKEND_URL_PLACEHOLDER;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
        }

        # Cache static assets (js, css, images, fonts)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Deny hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
