# =====================================================
# Render Blueprint — Kalapak Code Team Website
# =====================================================
# Deploy: Go to https://render.com → New → Blueprint
# Connect your GitHub repo and Render will auto-detect this file.
#
# Production custom domains:
#   Backend → APP_URL = https://api.kalapak-team.space
#   Backend → FRONTEND_URL = https://kalapak-team.space
#   Backend → CORS_ALLOWED_ORIGINS = https://kalapak-team.space,https://www.kalapak-team.space
#   Backend → SITE_URL = https://kalapak-team.space
#   Frontend → BACKEND_URL = https://api.kalapak-team.space
#   Frontend → NUXT_PUBLIC_API_URL = /api  (same-origin proxy via nginx)
# =====================================================

services:
  # -------------------------------------------------
  # Backend — Laravel 11 API
  # -------------------------------------------------
  - type: web
    name: kalapak-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    # Static file — passes as soon as PHP is listening (no full Laravel boot).
    healthCheckPath: /ping.php
    envVars:
      - key: APP_NAME
        value: "Kalapak Code Team"
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: "false"
      # Migrations off by default on free tier — concurrent migrate OOMs artisan serve.
      # Run once manually from Render shell: php artisan migrate --force
      - key: RUN_MIGRATIONS
        value: "0"
      - key: MIGRATE_DELAY_SECONDS
        value: "120"
      # Redis TLS + Predis blows the 512MB budget; file cache keeps the API alive.
      - key: ALLOW_REDIS
        value: "0"
      - key: APP_URL
        value: https://api.kalapak-team.space
      - key: FRONTEND_URL
        value: https://kalapak-team.space
      - key: CORS_ALLOWED_ORIGINS
        value: https://kalapak-team.space,https://www.kalapak-team.space
      - key: SITE_URL
        value: https://kalapak-team.space
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: kalapak-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: kalapak-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: kalapak-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: kalapak-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: kalapak-db
          property: password
      - key: DB_SSLMODE
        value: require
      - key: SANCTUM_STATEFUL_DOMAINS
        value: kalapak-team.space,www.kalapak-team.space
      - key: FILESYSTEM_DISK
        value: local
      # ── Upstash Redis (set REDIS_PASSWORD in Render dashboard) ──
      - key: REDIS_CLIENT
        value: predis
      - key: REDIS_SCHEME
        value: tls
      - key: REDIS_HOST
        value: living-tadpole-83117.upstash.io
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false # Set in Render dashboard
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: database
      - key: TURNSTILE_SECRET_KEY
        sync: false # Set manually: get from Cloudflare Dashboard → Turnstile → your site → Secret Key
      # ── Mail (required for Forgot Password emails) ──
      # Use Resend (resend.com), Mailgun, or any SMTP provider
      - key: MAIL_MAILER
        sync: false # e.g. smtp
      - key: MAIL_HOST
        sync: false # e.g. smtp.resend.com  or smtp.mailgun.org
      - key: MAIL_PORT
        sync: false # e.g. 587
      - key: MAIL_USERNAME
        sync: false # e.g. resend (for Resend) or your Mailgun username
      - key: MAIL_PASSWORD
        sync: false # your SMTP API key / password
      - key: MAIL_ENCRYPTION
        sync: false # tls
      - key: MAIL_FROM_ADDRESS
        sync: false # e.g. noreply@yourdomain.com
      - key: MAIL_FROM_NAME
        value: "Kalapak Code Team"
      - key: CLOUDINARY_URL
        sync: false # Set manually in Render dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ENDPOINT
        sync: false
      - key: SUPABASE_ACCESS_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
      - key: SUPABASE_REGION
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://api.kalapak-team.space/auth/google/callback
      - key: GITHUB_REDIRECT_URI
        value: https://api.kalapak-team.space/auth/github/callback

  # -------------------------------------------------
  # Frontend — Vue 3 + Nginx (production build)
  # -------------------------------------------------
  - type: web
    name: kalapak-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: BACKEND_URL
        value: https://api.kalapak-team.space
      - key: NUXT_API_PROXY_TARGET
        value: https://api.kalapak-team.space
      - key: NUXT_PUBLIC_API_URL
        value: /api
      - key: NUXT_PUBLIC_SITE_URL
        value: https://kalapak-team.space

# -------------------------------------------------
# PostgreSQL Database
# -------------------------------------------------
databases:
  - name: kalapak-db
    plan: free
    databaseName: kalapak_db
    user: kalapak_user
